name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizops_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./apps/api
        run: pnpm run prisma:generate

      - name: Push Schema to Test Database
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizops_ai?schema=public
        run: pnpm run prisma:push

      - name: Seed Initial Test Data
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizops_ai?schema=public
        run: pnpm run prisma:seed

      - name: Typecheck Backend (@bizops/api)
        run: pnpm --filter @bizops/api exec tsc --noEmit

      - name: Typecheck Frontend (web)
        run: pnpm --filter web exec tsc -b --noEmit

      - name: Start API Server
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizops_ai?schema=public
          SESSION_SECRET: test-session-secret-must-be-at-least-32-chars-long
          EMAIL_PROVIDER: simulation
          PORT: 4000
          AGENT_RATE_LIMIT_MAX_PER_MINUTE: 1000
          AUTH_RATE_LIMIT_MAX_PER_MINUTE: 1000
          RATE_LIMIT_MAX_PER_MINUTE: 1000
        run: |
          nohup pnpm exec tsx src/server.ts > /tmp/api.log 2>&1 &
          SERVER_PID=$!
          echo "API_PID=$SERVER_PID" >> $GITHUB_ENV

          echo "Waiting for API to become ready on http://127.0.0.1:4000/health..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:4000/health > /dev/null 2>&1; then
              echo "API is ready on http://127.0.0.1:4000/health after ${i}s"
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "API process exited unexpectedly (PID: $SERVER_PID). Server log:"
              cat /tmp/api.log
              exit 1
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "API failed to respond on http://127.0.0.1:4000/health within 30s. Server log:"
            cat /tmp/api.log
            exit 1
          fi

      - name: Run Backend Tests
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizops_ai?schema=public
          SESSION_SECRET: test-session-secret-must-be-at-least-32-chars-long
          EMAIL_PROVIDER: simulation
          PORT: 4000
          AGENT_RATE_LIMIT_MAX_PER_MINUTE: 1000
          AUTH_RATE_LIMIT_MAX_PER_MINUTE: 1000
          RATE_LIMIT_MAX_PER_MINUTE: 1000
        run: |
          pnpm exec tsx test_phase10_orchestration.ts
          pnpm exec tsx test_phase9_integrations.ts
          pnpm exec tsx test_phase8_readiness.ts
          pnpm exec tsx test_phase7_capabilities.ts
          pnpm exec tsx test_agent_workflow.ts
          pnpm exec tsx test_phase5_hardening.ts
          pnpm exec tsx test_rbac_lockdown.ts

      - name: Stop API Server
        if: always()
        run: |
          if [ -n "$API_PID" ] && kill -0 "$API_PID" 2>/dev/null; then
            echo "Stopping API server (PID: $API_PID)..."
            kill "$API_PID" 2>/dev/null || true
          fi
          fuser -k 4000/tcp 2>/dev/null || true

      - name: Build Backend Production Bundle
        run: pnpm --filter @bizops/api run build

      - name: Build Frontend Production Bundle
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL || 'http://localhost:4000' }}
        run: pnpm --filter web run build
